<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Who Said It?</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="/css/game.css">
    </head>
    <body>
        <div class="container">
            <header>
                <h1></i> Who Said It?</h1>
            </header>

            <h2 id="whoWon" class="win-message"></h2>

            <!-- Scoreboard -->
            <div class="scoreboard">
                <div class="team-score" id="teamA">
                    <h2>Team A</h2>
                    <p class="teamRounds" id="teamARounds">0</p>
                    <p class="teamScores" id="teamAScore">0</p>
                </div>
                <div class="team-score" id="teamB">
                    <h2>Team B</h2>
                    <p class="teamRounds" id="teamBRounds">0</p>
                    <p class="teamScores" id="teamBScore">0</p>
                </div>
            </div>

            <!-- Game Card -->
            <div class="game-card">

                <div class="current-turn-info">
                    <h3 id="activeTeamLabel"><i class="fa-solid fa-arrows-rotate"></i> Team A's Turn</h3>
                    <p><strong><i class="fa-solid fa-microphone"></i> Speaker:</strong> <span id="currentSpeaker">---</span></p>
                    <p><strong><i class="fa-solid fa-brain"></i> Guesser:</strong> <span id="currentGuesser">---</span></p>
                </div>

                <div class="word-to-guess">
                    <h2>Word to Guess</h2>
                    <p id="word">???</p>
                </div>

                <div class="forbidden-words">
                    <h3>Forbidden Words</h3>
                    <ul id="forbidden-list">???</ul>
                </div>

                <div class="timer">
                    <i class="fa-solid fa-stopwatch"></i> <span id="timer">60</span>
                </div>

                <button id="startTimerButton">Start Timer</button>

                <div class="buttons">
                    <button id="confirmButton"><i class="fa-solid fa-check"></i> Confirm</button>
                    <button id="buzzButton"><i class="fa-solid fa-xmark"></i> Buzz</button>
                </div>
            </div>
        </div>

        <!-- Overlays and Sounds -->
        <div id="green-overlay"></div>
        <div id="red-overlay"></div>
        <audio id="buzz-sound" src="/sounds/wrong.mp3"></audio>
        <audio id="confirm-sound" src="/sounds/right.mp3"></audio>

        <script src="/socket.io/socket.io.js"></script>
        <script src="/main.js" type="module"></script>
    </body>
</html>
